name: App

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/app.yml"
      - "packaging/app/**"
  pull_request:
    branches: [main]
    paths:
      - "app/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/app.yml"
      - "packaging/app/**"

permissions:
  contents: read

env:
  # One pinned stable Flutter for every job; upgrades are explicit PRs.
  FLUTTER_VERSION: "3.50.0"

jobs:
  check:
    name: Format, analyze, test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: dart format
        run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - name: flutter test (unit, stub server, contract vs docs/api/openapi.yaml)
        run: flutter test

  build-linux:
    name: Build Linux desktop
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build linux --debug

  build-android:
    name: Build Android (debug, unsigned)
    runs-on: ubuntu-latest
    needs: check
    # PR/main check only; signed release builds live in app-release.yml (AGED-US-0033).
    continue-on-error: true
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
