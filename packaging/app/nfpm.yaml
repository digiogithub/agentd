# nfpm configuration for the agentd client app .deb (Flutter Linux bundle).
#
# Used by .github/workflows/app-release.yml; environment variables:
#   VERSION  package version without the leading "app-v" (e.g. 1.2.3 or 1.2.3-rc.1)
# The release bundle must be at app/build/linux/x64/release/bundle.
name: agentd-app
arch: amd64
platform: linux
version: ${VERSION}
version_schema: semver
section: devel
priority: optional
maintainer: Digio Soluciones Digitales SL <noreply@github.com>
vendor: Digio Soluciones Digitales SL
homepage: https://github.com/digiogithub/agentd
license: MIT
description: |-
  Client app for agentd (Flutter desktop).
  Monitor and drive your coding agents from agentd. Registers the agentd://
  URL scheme for pairing links.
depends:
  - libgtk-3-0
  - libsecret-1-0
  - libayatana-appindicator3-1
  - libnotify4
contents:
  - src: app/build/linux/x64/release/bundle/
    dst: /opt/agentd-app/
    type: tree
  - src: /opt/agentd-app/agentd_app
    dst: /usr/bin/agentd-app
    type: symlink
  - src: app/linux/packaging/dev.digio.agentd_app.desktop
    dst: /usr/share/applications/dev.digio.agentd_app.desktop
    file_info:
      mode: 0644
  - src: app/linux/packaging/dev.digio.agentd_app.metainfo.xml
    dst: /usr/share/metainfo/dev.digio.agentd_app.metainfo.xml
    file_info:
      mode: 0644
  - src: app/linux/packaging/dev.digio.agentd_app.png
    dst: /usr/share/icons/hicolor/512x512/apps/dev.digio.agentd_app.png
    file_info:
      mode: 0644
  - src: LICENSE
    dst: /usr/share/doc/agentd-app/LICENSE
    file_info:
      mode: 0644
scripts:
  postinstall: packaging/app/linux/postinstall.sh
